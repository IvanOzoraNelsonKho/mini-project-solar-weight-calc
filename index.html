<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas Web - Hitung Berat di Planet</title>
  </head>
  <link rel="stylesheet" href="style.css">
  <body>
    <div class="kotak">
      <h2>Hitung Berat di Planet</h2>
      <hr />
      <br />

      <label>Berat Badan di Bumi (kg):</label><br />
      <input type="number" id="input-berat" placeholder="Misal: 55" />
      <br />
      <br />

      <label>Pilih Planet:</label><br />
      <select id="pilih-planet">
        <option value="" disabled selected>-- Pilih --</option>
        <option value="merkurius">Merkurius</option>
        <option value="venus">Venus</option>
        <option value="mars">Mars</option>
        <option value="jupiter">Jupiter</option>
        <option value="saturnus">Saturnus</option>
        <option value="uranus">Uranus</option>
        <option value="neptunus">Neptunus</option>
      </select>
      <br />
      <br />

      <button id="tombol">Hitung</button>

      <p id="pesan-error"></p>

      <div id="hasil">
        <br />
        <hr />
        <p>Berat kamu di <b id="nama-planet"></b> jadi:</p>
        <h3 id="angka-berat"></h3>
      </div>
    </div>
  </body>
</html>
