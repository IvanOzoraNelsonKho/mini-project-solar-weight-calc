<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas Web - Hitung Berat di Planet</title>
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <div class="kotak">
      <h2>Hitung Berat di Planet</h2>
      <hr />
      <br />

      <label>Berat Badan di Bumi (kg):</label><br />
      <input type="number" id="input-berat" placeholder="Misal: 55" />
      <br />
      <br />

      <label>Pilih Planet:</label><br />
      <select id="pilih-planet">
        <option value="" disabled selected>-- Pilih --</option>
        <option value="merkurius">Merkurius (g=3.7 m/s)</option>
        <option value="venus">Venus (g=8.87 m/s)</option>
        <option value="mars">Mars (g=3.71 m/s)</option>
        <option value="jupiter">Jupiter (g=24.79 m/s)</option>
        <option value="saturnus">Saturnus (g=10.44 m/s)</option>
        <option value="uranus">Uranus (g=8.69 m/s)</option>
        <option value="neptunus">Neptunus (g=11.15 m/s)</option>
      </select>
      <br />
      <br />

      <p>Hasil = berat di bumi * (gravitasi planet / 9.8)</p>

      <button id="tombol">Hitung</button>

      <p id="pesan-error"></p>

      <div id="hasil">
        <br />
        <hr />
        <div class="planet-visual">
          <img id="planet-image" src="" alt="Planet" width="80" />
        </div>
        <p>Berat kamu di <b id="nama-planet"></b> jadi:</p>
        <h3 id="angka-berat"></h3>
      </div>
    </div>
    <script src="logic.js"></script>
    <script src="dom.js"></script>
  </body>
</html>
